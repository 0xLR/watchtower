name: Package installers
on:
  workflow_dispatch:
    inputs:
      build_script:
        description: Engines to include (Retina is always included)
        type: choice
        default: package
        options:
          - package
          - package:go2rtc
          - package:mediamtx
          - package:all-engines
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-22.04
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run '${{ inputs.build_script }}' --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: watchtower-${{ runner.os }}-unsigned
          path: target/release/bundle/
          if-no-files-found: error
