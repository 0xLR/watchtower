name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm sidecar
      - run: pnpm --filter @watchtower/desktop build
      - run: pnpm test
      - run: git diff --exit-code -- packages/ipc-types
      - run: pnpm lint
      - name: Install headless test browser
        if: runner.os == 'Linux'
        run: pnpm --filter @watchtower/desktop exec playwright install --with-deps chromium
      - name: RTSP, service and nine-stream playback tests
        if: runner.os == 'Linux'
        run: pnpm test:media
      - run: pnpm build
